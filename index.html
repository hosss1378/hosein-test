<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Test - Image to Video MVP</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    #overlay {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      text-align: center; padding: 10px; color: #fff;
      background: rgba(0,0,0,0.55); font-size: 14px; pointer-events: none;
    }
    #example-target {
      position: fixed; bottom: 12px; right: 12px; z-index: 999;
      width: 90px; border: 2px solid #fff; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .example-label {
      position: fixed; bottom: 108px; right: 12px; z-index: 999;
      color: #fff; background: rgba(0,0,0,0.55); padding: 4px 8px;
      border-radius: 4px; font-size: 11px;
    }
    #sound-btn {
      position: fixed; bottom: 12px; left: 12px; z-index: 999;
      background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #fff;
      border-radius: 20px; padding: 8px 14px; font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="overlay">دوربین رو روی تصویر پایین-راست بگیر تا ویدیو پخش بشه</div>
  <div class="example-label">این عکس رو نشون بده</div>
  <img id="example-target" src="targets/card.png" alt="target" />
  <button id="sound-btn">🔇 صدا خاموشه (بزن روشن کن)</button>

  <a-scene
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets id="video-assets"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>
    <a-entity id="targets-root"></a-entity>
  </a-scene>

  <script>
    (async function () {
      const res = await fetch("targets.config.json", { cache: "no-store" });
      const cfg = await res.json();
      const scene = document.querySelector("a-scene");
      scene.setAttribute(
        "mindar-image",
        "imageTargetSrc: " + cfg.imageTargetSrc + "; autoStart: true; uiScanning: yes; uiLoading: yes;"
      );

      const assets = document.getElementById("video-assets");
      const root = document.getElementById("targets-root");
      let soundOn = false;
      const allVideos = [];

      cfg.targets.forEach((t) => {
        const type = t.type || "video"; // نبود type یعنی همون ویدیوی قدیمی
        const targetEntity = document.createElement("a-entity");
        targetEntity.setAttribute("mindar-image-target", "targetIndex: " + t.targetIndex);

        if (type === "model") {
          const modelEntity = document.createElement("a-entity");
          modelEntity.setAttribute("gltf-model", "url(" + t.model + ")");
          const scale = t.scale || 0.1;
          modelEntity.setAttribute("scale", `${scale} ${scale} ${scale}`);
          const pos = t.position || [0, 0, 0];
          modelEntity.setAttribute("position", pos.join(" "));
          const rot = t.rotation || [0, 0, 0];
          modelEntity.setAttribute("rotation", rot.join(" "));
          modelEntity.setAttribute("visible", "false");

          if (t.rotate) {
            const speed = t.rotateSpeed || 30; // درجه بر ثانیه
            const durMs = Math.max(200, (360 / speed) * 1000);
            modelEntity.setAttribute(
              "animation__spin",
              `property: rotation; from: ${rot[0]} ${rot[1]} ${rot[2]}; to: ${rot[0]} ${rot[1] + 360} ${rot[2]}; loop: true; dur: ${durMs}; easing: linear`
            );
          }

          targetEntity.appendChild(modelEntity);

          targetEntity.addEventListener("targetFound", () => {
            modelEntity.setAttribute("visible", "true");
          });
          targetEntity.addEventListener("targetLost", () => {
            modelEntity.setAttribute("visible", "false");
          });
        } else {
          const videoId = "video-" + t.targetIndex;

          const videoEl = document.createElement("video");
          videoEl.setAttribute("id", videoId);
          videoEl.setAttribute("src", t.video);
          videoEl.setAttribute("preload", "auto");
          videoEl.setAttribute("loop", "true");
          videoEl.setAttribute("crossorigin", "anonymous");
          videoEl.setAttribute("playsinline", "true");
          videoEl.setAttribute("webkit-playsinline", "true");
          videoEl.muted = true; // موبایل بدون تعامل کاربر فقط muted رو اجازه میده autoplay بشه
          assets.appendChild(videoEl);
          allVideos.push(videoEl);

          const videoPlane = document.createElement("a-video");
          videoPlane.setAttribute("src", "#" + videoId);
          videoPlane.setAttribute("width", t.width);
          videoPlane.setAttribute("height", t.height);
          videoPlane.setAttribute("position", "0 0 0");
          videoPlane.setAttribute("rotation", "0 0 0");
          targetEntity.appendChild(videoPlane);

          targetEntity.addEventListener("targetFound", () => {
            videoEl.currentTime = 0;
            videoEl.play().catch(() => {});
          });
          targetEntity.addEventListener("targetLost", () => {
            videoEl.pause();
          });
        }

        root.appendChild(targetEntity);
      });

      const soundBtn = document.getElementById("sound-btn");
      soundBtn.addEventListener("click", () => {
        soundOn = !soundOn;
        allVideos.forEach((v) => (v.muted = !soundOn));
        soundBtn.textContent = soundOn ? "🔊 صدا روشنه" : "🔇 صدا خاموشه (بزن روشن کن)";
      });
    })();
  </script>
</body>
</html>
